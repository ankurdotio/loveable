apiVersion: apps/v1
kind: Deployment
metadata:
  name:  project-deployment
  labels:
    name: project-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  project
  template:
    metadata:
      labels:
        app:  project
    spec:
      serviceAccountName: resource-manager
      containers:
      - image:  329599656829.dkr.ecr.ap-southeast-1.amazonaws.com/project-service
        name:  project-main-container 
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "250m"
            memory: "250M"
          limits:
            cpu: "500m"
            memory: "500M"
        livenessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name:  ACCESS_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name:  auth
              key:  ACCESS_TOKEN_SECRET    
        - name:  MONGODB_URI
          valueFrom:
            secretKeyRef:
              name:  database
              key:  PROJECT_DB
        - name:  REDIS_URL
          valueFrom:
            secretKeyRef:
              name:  redis
              key:  REDIS_URL
        - name:  MESSAGE_BROKER_URL
          valueFrom:
            secretKeyRef:
              name:  message-broker
              key:  MESSAGE_BROKER_URL
        ports:
        - containerPort:  3000
          name:  http
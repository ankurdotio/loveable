apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pineapple
  labels:
    app.kubernetes.io/name: pineapple
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: auth-service
            port: 
              number: 80
